# The daemon's heap kept small: the machine builds Rust beside it (cargo-ndk, from the app's build).
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# The Rust library's ABIs (phones, the emulator) and its cargo profile; `-Pkompozr.abis=x86_64` builds one.
kompozr.abis=arm64-v8a,x86_64
kompozr.cargoProfile=android
