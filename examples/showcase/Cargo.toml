[package]
name = "showcase"
description = "KompozR's showcase: the C++ Kompoz showcase's shell and Material screen in Kotlin's syntax (.kt files through kompoz_file!), run on the platform's window (KOMPOZ_HEADLESS=1: without one)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kompoz = { path = "../../crates/kompoz" }

# The program's Windows resources (icon, manifest, version): kompoz-platform's build helper alone (no platforms).
[build-dependencies]
kompoz-platform = { path = "../../crates/kompoz-platform", default-features = false }

[dev-dependencies]
kompoz = { path = "../../crates/kompoz", features = ["test"] }

# The showcase composed section by section by the test rule, and run headless (a GPU device: lavapipe in CI) through
# the Material screen: one thread, in sequence.
[[test]]
name = "headless"
harness = false

# The showcase in a real window on Windows (KOMPOZ_DISPLAY_TESTS=1), its shots its headless run's.
[[test]]
name = "windows"
harness = false

# The showcase in a real window on macOS (KOMPOZ_DISPLAY_TESTS=1), its shots its headless run's.
[[test]]
name = "macos"
harness = false
