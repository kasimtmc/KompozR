[package]
name = "counter"
description = "KompozR's Counter: a count and a button that adds to it, built from foundation's pieces, run on the platform's window (KOMPOZ_HEADLESS=1: without one)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kompoz-foundation = { path = "../../crates/kompoz-foundation" }
kompoz-graphics = { path = "../../crates/kompoz-graphics" }
kompoz-platform = { path = "../../crates/kompoz-platform" }
kompoz-runtime = { path = "../../crates/kompoz-runtime" }
kompoz-text = { path = "../../crates/kompoz-text" }
kompoz-ui = { path = "../../crates/kompoz-ui" }

# The program's Windows resources (icon, manifest, version): kompoz-platform's build helper alone (no platforms).
[build-dependencies]
kompoz-platform = { path = "../../crates/kompoz-platform", default-features = false }

[dev-dependencies]
kompoz-gpu = { path = "../../crates/kompoz-gpu" }

# The Counter in a real window on Windows (KOMPOZ_DISPLAY_TESTS=1), its shots the headless Counter's drawn in the
# test's process: one thread.
[[test]]
name = "windows"
harness = false
