name: CI

on:
  push:
    branches: [main]
  pull_request:
  # (by hand: the JetBrains plugin's build too, which downloads the IDEs it is built and verified against)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Line tables only (a panic's backtrace keeps its files and lines): the workspace's tests built with whole debug
  # info filled the runner's disk (the linux job's `cargo test --workspace` ran out of space).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The platform's keyboards: libxkbcommon, xkeyboard-config's keymaps, libX11's compose tables (its tests need
      # them: KOMPOZ_XKB_REQUIRED); dbus-daemon, the private bus our D-Bus client, the portal and the AT-SPI bridge
      # are tested on (KOMPOZ_DBUS_REQUIRED); libcurl (curl's), the images' HTTP client, tested against a server on
      # 127.0.0.1 (KOMPOZ_CURL_REQUIRED).
      - name: xkbcommon and its data, dbus-daemon, libcurl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon0 libxkbcommon-x11-0 xkb-data libx11-data dbus \
            curl
      - run: cargo fmt --all --check
      # The API index (the macros' api-index.txt, the Kotlin syntax's index/generated.rs) as the sources say.
      - run: cargo xtask kotlin-index --check
      # (the web's time zone database against the runner's zoneinfo: skipped where its version is another)
      - run: cargo xtask tzdata --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
        env:
          KOMPOZ_XKB_REQUIRED: "1"
          KOMPOZ_DBUS_REQUIRED: "1"
          KOMPOZ_CURL_REQUIRED: "1"

  # The Linux platforms on display servers, on lavapipe with the validation layers (an error they report fails the
  # run, so does their absence): the Counter clicked and resized by a script on Weston's headless backend (Wayland:
  # lavapipe's WSI presents through wl_shm, which needs no GPU) and on Xvfb (X11), its shots compared and kept; then
  # the display tests (KOMPOZ_DISPLAY_TESTS=1): the Wayland platform's on a Weston of their own, the X11 platform's
  # and the Counter's on Xvfb, and the app's own drags out to another client on Xvfb driven through XTEST (Weston's
  # headless backend has no input a client can make: the Wayland drags run on kwin, locally). The wallpaper isn't looked for (the same shots everywhere), nor the desktop's services
  # (no session bus).
  linux-display:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      KOMPOZ_GPU_VALIDATION: "1"
      KOMPOZ_NO_WALLPAPER_COLORS: "1"
      KOMPOZ_SCALE: "1"
      DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Weston, Xvfb, dbus, Vulkan on lavapipe with the validation layers, the platforms' libraries, a font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston xvfb xauth dbus mesa-vulkan-drivers libvulkan1 \
            vulkan-validationlayers libwayland-client0 libwayland-cursor0 libxkbcommon0 libxkbcommon-x11-0 xkb-data \
            libx11-6 libxi6 libxcursor1 libxrandr2 libx11-xcb1 libxext6 libxtst6 fonts-dejavu-core
      # Lavapipe for every run; a runtime directory of the job's own (Weston's socket goes there); what checks a run.
      - name: Lavapipe, a runtime directory, the runs' checks
        run: |
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
          mkdir -p -m 0700 "$RUNNER_TEMP/runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/runtime" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/check-shots.sh" <<'EOF'
          # A run's directory checked: drawn with Vulkan, its three shots there, the click and the resize seen in them
          # (the resized one 500x400), no validation errors (nor validation missing) in its log.
          set -euo pipefail
          dir=$1
          grep -q "kompoz: renderer: KompozR on vulkan" "$dir/counter.log" || { echo "no renderer"; exit 1; }
          size() { local hex; hex=$(od -An -j16 -N8 -tx1 "$1" | tr -d ' \n'); echo "$((16#${hex:0:8}))x$((16#${hex:8:8}))"; }
          for shot in before after resized; do
            test -s "$dir/$shot.png" || { echo "no $shot.png"; exit 1; }
          done
          if cmp -s "$dir/before.png" "$dir/after.png"; then echo "the click changed nothing"; exit 1; fi
          test "$(size "$dir/before.png")" = 360x480 || { echo "before.png is $(size "$dir/before.png")"; exit 1; }
          test "$(size "$dir/resized.png")" = 500x400 || { echo "resized.png is $(size "$dir/resized.png")"; exit 1; }
          if grep -E "kompoz: GPU validation:|there is no VK_LAYER_KHRONOS_validation" "$dir/counter.log"; then exit 1; fi
          EOF
          echo 'KOMPOZ_CI_SCRIPT=wait 30;shot SHOTS/before.png;click 70 70;wait 30;shot SHOTS/after.png;resize 500 400;sleep 1500;wait 10;shot SHOTS/resized.png;quit' >> "$GITHUB_ENV"
      - run: cargo build -p counter
      - name: The Counter on Weston (headless backend), clicked and resized by a script
        run: |
          mkdir -p shots/wayland
          weston --backend=headless --renderer=pixman --width=800 --height=600 --idle-time=0 --no-config \
            --socket=kompoz-ci > shots/wayland/weston.log 2>&1 &
          weston=$!
          trap 'kill "$weston" 2>/dev/null || true' EXIT
          for i in $(seq 100); do test -S "$XDG_RUNTIME_DIR/kompoz-ci" && break; sleep 0.1; done
          test -S "$XDG_RUNTIME_DIR/kompoz-ci" || { cat shots/wayland/weston.log; exit 1; }
          WAYLAND_DISPLAY=kompoz-ci KOMPOZ_SCRIPT="${KOMPOZ_CI_SCRIPT//SHOTS/$PWD/shots/wayland}" \
            target/debug/counter 2>&1 | tee shots/wayland/counter.log
          bash "$RUNNER_TEMP/check-shots.sh" shots/wayland
      - name: The Counter on Xvfb (X11), clicked and resized by a script
        run: |
          mkdir -p shots/x11
          KOMPOZ_PLATFORM=x11 KOMPOZ_SCRIPT="${KOMPOZ_CI_SCRIPT//SHOTS/$PWD/shots/x11}" \
            xvfb-run -a -s "-screen 0 1280x1024x24" target/debug/counter 2>&1 | tee shots/x11/counter.log
          bash "$RUNNER_TEMP/check-shots.sh" shots/x11
      - name: The Counter's shots on Weston and Xvfb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-shots
          path: shots/
          if-no-files-found: ignore
      - name: The display tests (Wayland on Weston; X11 and the Counter's on Xvfb)
        env:
          KOMPOZ_DISPLAY_TESTS: "1"
          KOMPOZ_TEST_COMPOSITOR: weston
          KOMPOZ_XKB_REQUIRED: "1"
        run: |
          cargo test -p kompoz-platform --test wayland_display
          xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p kompoz-platform --lib display_tests
          xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p kompoz-platform --test x11_windows
          KOMPOZ_X11_XTEST=1 xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p kompoz-platform --test drag_display
          xvfb-run -a -s "-screen 0 1280x1024x24" cargo test -p counter --test x11
      - name: The Wayland display tests' runs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-display-test-runs
          path: |
            /tmp/kompoz-wayland-test-*/
            /tmp/kompoz-drag-test-*/
          if-no-files-found: ignore

  # The GPU renderer's tests on Vulkan on lavapipe (Mesa's, on the CPU), with the validation layers: no device is a
  # failure, so is an error the layers report; the scenes against tests/golden (lavapipe's pictures).
  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Vulkan (the loader, Mesa's lavapipe, the validation layers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-validationlayers \
            fonts-dejavu-core libfontconfig1
      - name: kompoz-gpu's tests (Vulkan on lavapipe, validated, against tests/golden)
        env:
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          cargo test -p kompoz-gpu
      # The app core on the headless platform: scripts, the state file, frames, events, the kept frame through a
      # swapchain's images.
      - name: kompoz-platform's app core tests (Vulkan on lavapipe, validated)
        env:
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          cargo test -p kompoz-platform --test app_core
      # The Counter run headless with C++'s CI script, a click changing its shot: drawing only into its kept frame,
      # then presenting to a Vulkan headless surface (VK_EXT_headless_surface) as a window would.
      - name: The Counter, headless, clicked by a script
        env:
          KOMPOZ_GPU_VALIDATION: "1"
          KOMPOZ_HEADLESS: "1"
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          cargo build -p counter
          for swapchain in 0 1; do
            rm -f before.png shot.png
            KOMPOZ_HEADLESS_SWAPCHAIN=$swapchain \
              KOMPOZ_SCRIPT="wait 30;shot before.png;click 70 70;wait 30;shot shot.png;quit" \
              target/debug/counter 2>&1 | tee counter.log
            test -s before.png && test -s shot.png
            if cmp -s before.png shot.png; then echo "the click changed nothing"; exit 1; fi
            if grep -q "GPU validation" counter.log; then exit 1; fi
          done
      # The Kotlin Counter (examples/counter-kotlin: its UI a .kt file) run headless by the same script: its shots,
      # before the click and after, the Rust Counter's pixels.
      - name: The Kotlin Counter, headless, drawing the Rust Counter's pixels
        env:
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          cargo test -p counter-kotlin --test headless
      # The showcase (examples/showcase: the C++ showcase's shell and Material screen, its UI .kt files): each
      # section composed; run headless through the Material tab page by page (light and dark, scales 1 and 2), its
      # sections against the C++ showcase's pictures (examples/showcase/reference) outside the listed regions.
      - name: The showcase, headless, against the C++ showcase's pictures
        env:
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          cargo test -p showcase --test headless
      - name: The Counter's shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-shots
          path: |
            before.png
            shot.png
          if-no-files-found: ignore
      - name: The pictures that differ from their goldens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-golden-differences
          path: |
            crates/kompoz-gpu/tests/golden/*.actual.png
            crates/kompoz-gpu/tests/golden/*.diff.png
            target/tmp/showcase-shots/*/s*.png
            target/tmp/showcase-shots/*/top*.png
            target/tmp/showcase-shots/*/bottom*.png
            target/tmp/showcase-shots/*/places*.png
          if-no-files-found: ignore

  # The shaders' generated SPIR-V, MSL and WGSL are what the .slang sources compile to (cargo xtask shaders --check),
  # with Slang's pinned release (the same as C++ Kompoz's scripts/shaders.py: its URL and SHA-256), cached, and
  # SPIRV-Tools' spirv-val.
  shaders:
    runs-on: ubuntu-latest
    env:
      SLANG_VERSION: "2026.20"
      SLANG_SHA256: e863e568c204810d6e8bc31852f056aef6763c55ea9925db2db7affa060347c9
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: SPIRV-Tools (spirv-val)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends spirv-tools
      - name: Slang, cached
        id: slang
        uses: actions/cache@v4
        with:
          path: ~/.cache/slang-${{ env.SLANG_VERSION }}
          key: slang-${{ env.SLANG_VERSION }}-${{ env.SLANG_SHA256 }}
      - name: Slang's release (pinned, its checksum checked)
        if: steps.slang.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/slang.tar.gz" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          echo "${SLANG_SHA256}  $RUNNER_TEMP/slang.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.cache/slang-${SLANG_VERSION}"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$HOME/.cache/slang-${SLANG_VERSION}"
      - name: cargo xtask shaders --check
        run: |
          export KOMPOZ_SLANGC="$HOME/.cache/slang-${SLANG_VERSION}/bin/slangc"
          cargo xtask shaders --check

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: The runtime's unsafe code under Miri
        run: cargo miri test -p kompoz-runtime --lib --test runtime --test macros

  # The language server with its tools (KOMPOZ_RUST_ANALYZER_REQUIRED, KOMPOZ_KATE_REQUIRED: a missing one fails
  # the run instead of skipping): the toolchain's rust-analyzer behind it and behind the shadow project (rustc's
  # errors on Kotlin lines), KSyntaxHighlighting's command line highlighter for Kate's Kompoz Rust.
  lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: ksyntaxhighlighter6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libkf6syntaxhighlighting-tools
      # (the shadow project's test checks a crate offline: the workspace's dependencies fetched first)
      - run: cargo fetch
      - run: cargo test -p kompoz-lsp
        env:
          KOMPOZ_RUST_ANALYZER_REQUIRED: "1"
          KOMPOZ_KATE_REQUIRED: "1"

  # The workspace for the other platforms' targets, checked from Linux (no SDK, no linker: what is checked doesn't
  # link): Windows (gnu), Android (both ABIs the apk has), Apple's (arm64, Intel), with clippy as the linux job's. The
  # Linux platforms and their tests are Linux's own (cfg), Vulkan isn't built for Apple's systems (Metal is theirs).
  # (Android's clippy thinks `thread_local!`s already `const` could be: its lint is off there.)
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu, aarch64-linux-android, x86_64-linux-android, aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # (The examples' Windows resources are compiled by their build scripts: MinGW-w64's windres.)
      - name: MinGW-w64's binutils (windres)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64
      - name: Windows (x86_64-pc-windows-gnu)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu
      - name: Android (aarch64-linux-android)
        run: cargo clippy --workspace --all-targets --target aarch64-linux-android -- -A clippy::missing_const_for_thread_local
      - name: macOS (aarch64-apple-darwin)
        run: cargo clippy --workspace --all-targets --target aarch64-apple-darwin
      # The other ABIs: the crates whose code differs by them (C's types, the platform's own modules).
      - name: Android (x86_64-linux-android) and macOS (x86_64-apple-darwin), the system-facing crates
        run: |
          for target in x86_64-linux-android x86_64-apple-darwin; do
            cargo clippy -p kompoz-runtime -p kompoz-text -p kompoz-gpu -p kompoz-platform --target "$target" \
              -- -A clippy::missing_const_for_thread_local
          done

  # Android (stage 15 A0): clippy for both of the app's targets, strict; then the showcase's APK as an app builds it
  # (examples/showcase/android: Gradle with AGP 9.5.1 and Kotlin 2.4.21, its caches kept between runs; KompozR's
  # Kotlin side, the `:kompoz` module; the showcase's library for arm64-v8a and x86_64 by cargo-ndk from the app's
  # build, in the `android` profile), kept as an artifact. Running it on an emulator is the android-emulator job's
  # (A4).
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "29.0.14206865"
      CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (aarch64-linux-android, x86_64-linux-android)
        run: |
          for target in aarch64-linux-android x86_64-linux-android; do
            cargo clippy --workspace --all-targets --target "$target" -- -D warnings -A clippy::missing_const_for_thread_local
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        id: ndk
        with:
          # (the runner's ANDROID_HOME: the env context has only the workflow's own variables)
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}
      - name: The NDK (the app's ndkVersion), the SDK's platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          packages=("platforms;android-36")
          [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] || packages+=("ndk;$NDK_VERSION")
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}" > /dev/null
      - name: cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: The showcase's APK (both ABIs)
        working-directory: examples/showcase/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Its library's natives registered by name (JNI_OnLoad exported, the Kotlin classes' natives in it)
        run: |
          for abi in arm64-v8a x86_64; do
            so=examples/showcase/android/app/build/rustJniLibs/$abi/libshowcase.so
            "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "$so" \
              | grep -q ' T JNI_OnLoad$' || { echo "$so: no JNI_OnLoad"; exit 1; }
          done
          unzip -l examples/showcase/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/(arm64-v8a|x86_64)/libshowcase.so'
      - uses: actions/upload-artifact@v4
        with:
          name: kompozr-showcase-android
          path: examples/showcase/android/app/build/outputs/apk/debug/app-debug.apk

  # The Windows platform on windows-latest (MSVC, the runner's own target): clippy for Windows' cfg; then on Mesa's
  # lavapipe as mesa-dist-win builds it for Windows (cached; registered as the system's Vulkan driver: the runner is
  # elevated, so the loader ignores VK_DRIVER_FILES; the runner's own driver has no surfaces) the workspace's tests
  # (the showcase's against the C++ showcase's pictures too: its text in the showcase's fonts alone, KOMPOZ_FONTS),
  # and in real windows: the Counter and the Kotlin Counter (their shots the headless Counter's, pixel for pixel), the
  # showcase (its window's shots its headless run's), the app's several windows, and the Counter by CI's script as
  # the Linux display job runs it (its shots checked and kept). The Vulkan validation layers on Windows (LunarG's SDK)
  # are package W8's: the device code is validated on Linux.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      MESA_DIST_WIN: "26.2.4"
      # (The main thread's stack as Linux's, 8 MiB: .cargo/config.toml's, which the workflow's RUSTFLAGS replaces.)
      RUSTFLAGS: -D warnings -Clink-arg=/STACK:8388608
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (Windows' cfg)
        run: cargo clippy --workspace --all-targets
      - uses: actions/cache@v4
        id: mesa
        with:
          path: mesa
          key: mesa-dist-win-${{ env.MESA_DIST_WIN }}
      - name: Mesa's lavapipe for Windows (mesa-dist-win)
        if: steps.mesa.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_DIST_WIN/mesa3d-$MESA_DIST_WIN-release-msvc.7z"
          7z x -omesa mesa.7z > /dev/null
      - name: Lavapipe registered as the system's Vulkan driver
        run: |
          icd="$(find "$PWD/mesa" -path '*x64*' -name 'lvp_icd*.json' | head -n 1)"
          [ -n "$icd" ] || { echo "no lavapipe in mesa-dist-win's archive:"; find mesa -maxdepth 2 | head -n 40; exit 1; }
          MSYS_NO_PATHCONV=1 reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$(cygpath -w "$icd")" /t REG_DWORD /d 0 /f
      - name: The workspace's tests (GPU tests on lavapipe)
        if: success() || failure()
        run: |
          cargo test --workspace --no-fail-fast --exclude showcase
          cargo test -p showcase --lib
          cargo test -p showcase --test headless
      - name: The Counters, the showcase and the app's windows in real windows (lavapipe)
        if: success() || failure()
        env:
          KOMPOZ_DISPLAY_TESTS: "1"
          KOMPOZ_GPU_REQUIRED: "1"
        run: |
          cargo test -p counter --test windows
          cargo test -p counter-kotlin --test windows
          cargo test -p showcase --test windows
          cargo test -p kompoz-platform --test win32_windows
      # (The UI Automation bridge's own test, a client in-process against a window of its own, runs with the
      # workspace's tests; this one drives the app in its window as Narrator would: everything required here.)
      - name: UI Automation's client driving the app in its window (lavapipe)
        if: success() || failure()
        env:
          KOMPOZ_DISPLAY_TESTS: "1"
          KOMPOZ_GPU_REQUIRED: "1"
        run: cargo test -p kompoz-platform --test uia_windows
      # (Drops through the window's registered drop target as a source makes them, the effect the app's answer; the
      # app's drag out by DoDragDrop to a window of the test's.)
      - name: OLE drag and drop both ways with the app in its window (lavapipe)
        if: success() || failure()
        env:
          KOMPOZ_DISPLAY_TESTS: "1"
          KOMPOZ_GPU_REQUIRED: "1"
        run: cargo test -p kompoz-platform --test ole_windows
      # (The runner has no touch screen nor pen: a synthetic digitizer's fingers and pen, InjectSyntheticPointerInput,
      # as WM_POINTER messages to the app's window: a tap clicks once, a pen presses with its pressure and leaves.)
      - name: Fingers and a pen injected into the app in its window (lavapipe)
        if: success() || failure()
        env:
          KOMPOZ_DISPLAY_TESTS: "1"
          KOMPOZ_GPU_REQUIRED: "1"
        run: cargo test -p kompoz-platform --test pointer_windows
      - name: The Counter in a window by CI's script, clicked and resized (lavapipe)
        if: success() || failure()
        env:
          KOMPOZ_SCALE: "1"
        run: |
          cargo build -p counter
          mkdir -p shots
          KOMPOZ_SCRIPT="wait 30;shot shots/before.png;click 70 70;wait 30;shot shots/after.png;resize 500 400;sleep 1500;wait 10;shot shots/resized.png;quit" \
            target/debug/counter.exe 2>&1 | tee shots/counter.log
          grep -q "kompoz: renderer: KompozR on vulkan" shots/counter.log || { echo "no renderer"; exit 1; }
          size() { local hex; hex=$(od -An -j16 -N8 -tx1 "$1" | tr -d ' \n'); echo "$((16#${hex:0:8}))x$((16#${hex:8:8}))"; }
          for shot in before after resized; do test -s "shots/$shot.png" || { echo "no $shot.png"; exit 1; }; done
          if cmp -s shots/before.png shots/after.png; then echo "the click changed nothing"; exit 1; fi
          test "$(size shots/before.png)" = 360x480 || { echo "before.png is $(size shots/before.png)"; exit 1; }
          test "$(size shots/resized.png)" = 500x400 || { echo "resized.png is $(size shots/resized.png)"; exit 1; }
      - name: The Counter's shots, the windows' test shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-shots
          path: |
            shots/
            target/tmp/counter-windows-*/
            target/tmp/counter-kotlin-windows-*/
            target/tmp/showcase-windows-*/
            target/tmp/win32-windows/
            target/tmp/showcase-shots/*/s*.png
            target/tmp/showcase-shots/*/top*.png
            target/tmp/showcase-shots/*/bottom*.png
            target/tmp/showcase-shots/*/places*.png
          if-no-files-found: ignore

  # macOS on Apple silicon (the runner's paravirtual Apple GPU), Metal: kompoz-gpu's tests against the same goldens
  # as lavapipe's, strictly (the renderer's y-up clip space runs here), Metal's API validation on (MTL_DEBUG_LAYER=1:
  # an error it finds aborts the run; KOMPOZ_GPU_VALIDATION=1 counts what Metal reports to the device), then the app
  # core and the Counters and the showcase on the headless platform (Metal drawing only into the kept frame, as C++'s
  # headless Metal step; the showcase's sections and its pictures against the C++ one's, its text in the showcase's
  # fonts alone through KOMPOZ_FONTS, as CoreText's aren't narrowed), then the macOS platform in real windows on
  # the runner's display (its own tests, the Counter's and the showcase's window shots against their headless runs',
  # the Counter by CI's script), then the workspace's tests. Each step runs
  # whether those before failed or not (each tells something of its own); the pictures that differ are kept.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - name: kompoz-gpu's tests (Metal, validated, against tests/golden)
        env:
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
          MTL_DEBUG_LAYER: "1"
        run: cargo test -p kompoz-gpu
      - name: kompoz-platform's app core tests (Metal, validated)
        if: success() || failure()
        env:
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
          MTL_DEBUG_LAYER: "1"
        run: cargo test -p kompoz-platform --test app_core
      - name: The Counter, headless, clicked by a script
        if: success() || failure()
        env:
          KOMPOZ_GPU_VALIDATION: "1"
          MTL_DEBUG_LAYER: "1"
          KOMPOZ_HEADLESS: "1"
        run: |
          rm -f before.png shot.png
          KOMPOZ_SCRIPT="wait 30;shot before.png;click 70 70;wait 30;shot shot.png;quit" target/debug/counter 2>&1 \
            | tee counter.log
          test -s before.png && test -s shot.png
          if cmp -s before.png shot.png; then echo "the click changed nothing"; exit 1; fi
          if grep -qE "GPU validation|Metal: " counter.log; then exit 1; fi
      - name: The Kotlin Counter, headless, drawing the Rust Counter's pixels
        if: success() || failure()
        env:
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
          MTL_DEBUG_LAYER: "1"
        run: cargo test -p counter-kotlin --test headless
      - name: The showcase, headless
        if: success() || failure()
        env:
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
          MTL_DEBUG_LAYER: "1"
        run: cargo test -p showcase --test headless
      # The macOS platform's own unit tests: its keys, its input methods' replacement ranges, what NSAccessibility
      # says of the semantics tree (roles, values, actions, notifications) and that its names are AppKit's constants'.
      - name: The macOS platform's unit tests (NSAccessibility's names against AppKit's)
        if: success() || failure()
        run: cargo test -p kompoz-platform --lib macos
      # The macOS platform (AppKit) in real windows on the runner's display: the Counter by CI's script, the app's
      # windows, a transparent borderless one with a native menu bar, the Counter read and pressed through
      # NSAccessibility from inside the app (its elements, roles, values, a text field's selection); the Counter's and
      # the showcase's window shots their headless runs', pixel for pixel.
      - name: The macOS platform in real windows (Metal, validated)
        if: success() || failure()
        env:
          KOMPOZ_DISPLAY_TESTS: "1"
          KOMPOZ_GPU_REQUIRED: "1"
          KOMPOZ_GPU_VALIDATION: "1"
          MTL_DEBUG_LAYER: "1"
        run: |
          cargo test -p kompoz-platform --test macos_display
          cargo test -p counter --test macos
          cargo test -p showcase --test macos
      - name: The Counter in a window by CI's script, clicked and resized
        if: success() || failure()
        env:
          KOMPOZ_SCALE: "1"
          KOMPOZ_GPU_VALIDATION: "1"
          MTL_DEBUG_LAYER: "1"
        run: |
          mkdir -p shots
          KOMPOZ_SCRIPT="wait 30;shot shots/before.png;click 70 70;wait 30;shot shots/after.png;resize 500 400;sleep 1500;wait 10;shot shots/resized.png;quit" \
            target/debug/counter 2>&1 | tee shots/counter.log
          grep -q "kompoz: renderer: KompozR on metal" shots/counter.log || { echo "no renderer"; exit 1; }
          if grep -q "GPU validation" shots/counter.log; then exit 1; fi
          for shot in before after resized; do test -s "shots/$shot.png" || { echo "no $shot.png"; exit 1; }; done
          if cmp -s shots/before.png shots/after.png; then echo "the click changed nothing"; exit 1; fi
          test "$(sips -g pixelWidth -g pixelHeight shots/before.png | awk '/pixel/ {print $2}' | paste -sd x -)" = 360x480
          test "$(sips -g pixelWidth -g pixelHeight shots/resized.png | awk '/pixel/ {print $2}' | paste -sd x -)" = 500x400
      - name: The workspace's tests
        if: success() || failure()
        run: cargo test --workspace --no-fail-fast
      - name: The Counter's shots, and the pictures that differ from their goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-shots
          path: |
            before.png
            shot.png
            crates/kompoz-gpu/tests/golden/*.actual.png
            crates/kompoz-gpu/tests/golden/*.diff.png
            target/tmp/showcase-shots/*/s*.png
            target/tmp/showcase-shots/*/top*.png
            target/tmp/showcase-shots/*/bottom*.png
            target/tmp/showcase-shots/*/places*.png
            shots/
            target/tmp/macos-display/
            target/tmp/counter-macos-*/
            target/tmp/showcase-macos-*/
          if-no-files-found: ignore

  # The web's workspace (wasm32-unknown-unknown) as its build makes it: the pinned nightly (the web's only toolchain:
  # unwinding on wasm needs std rebuilt with panic=unwind, which only nightly's -Zbuild-std does; the Kotlin syntax's
  # exceptions and jumps unwind), with the standard exception-handling instructions. The same pin and flags are the
  # `cargo check-web` alias's (.cargo/config.toml).
  web-check:
    runs-on: ubuntu-latest
    env:
      WEB_NIGHTLY: nightly-2026-11-13
      RUSTFLAGS: -D warnings -Cpanic=unwind -Cllvm-args=-wasm-use-legacy-eh=false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.WEB_NIGHTLY }}
          components: rust-src, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -Zbuild-std=std,panic_unwind

  # kompoz-gpu's GPU tests in browsers, on WebGPU (`cargo xtask web-gpu-test`): built for the web on its pinned
  # nightly (std rebuilt with unwinding), served from 127.0.0.1 and run headless; every test and all of tests/golden
  # strict, as natively (WebGPU always validates: any error fails the run). Chrome on SwiftShader (its CPU WebGPU, as
  # lavapipe is natively); Firefox on Mesa's lavapipe through its own WebGPU (wgpu on Vulkan). The browsers are the
  # runner image's. What differs is kept: the pictures (`<name>.actual.png`, `<name>.diff.png`) and the browser's log.
  # Then the web platform (`cargo xtask web test`): the Counter and the showcase in the browser, run by scripts, their
  # shots against their headless runs' on lavapipe (the same scripts, fonts and environment), within the goldens' three.
  web-gpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      KOMPOZ_WEB_TOOLCHAIN: nightly-2026-11-13
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.KOMPOZ_WEB_TOOLCHAIN }}
          components: rust-src
      # (xtask itself on stable, the default after this)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # (Firefox's WebGPU, and the apps' native runs the web's shots are compared with)
      - name: Vulkan (the loader, Mesa's lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - name: The GPU tests in ${{ matrix.browser }}
        run: cargo xtask web-gpu-test ${{ matrix.browser == 'firefox' && '--firefox' || '' }}
      - name: The apps in ${{ matrix.browser }}
        run: cargo xtask web test ${{ matrix.browser == 'firefox' && '--firefox' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-gpu-${{ matrix.browser }}
          path: |
            target/web-gpu-test/*.png
            target/web-gpu-test/browser.log
            target/web-test/*/*.png
            target/web-test/*/web/browser.log
          if-no-files-found: ignore

  # The VS Code extension: its unit and grammar tests, and its package (kept as an artifact; publishing is by hand).
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode-kompozr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode-kompozr/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: kompozr-vscode
          path: editors/vscode-kompozr/*.vsix

  # The JetBrains plugin (CLion, RustRover): built, tested and verified against the IDEs it downloads (several GB:
  # by hand only).
  jetbrains:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/jetbrains-kompozr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon buildPlugin test verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: kompozr-jetbrains
          path: editors/jetbrains-kompozr/build/distributions/*.zip
