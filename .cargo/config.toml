[alias]
# Development tasks (xtask/): `cargo xtask shaders [--check]`.
xtask = "run -p xtask --"
# The web's check (wasm32-unknown-unknown) as its build makes it, on a nightly (CI pins nightly-2026-11-13): std
# rebuilt with panic=unwind (the Kotlin syntax's exceptions and jumps unwind; stable's wasm std aborts), the standard
# exception-handling instructions. Locally the installed nightly, which needs rust-src (naming a dated nightly that
# isn't installed makes rustup download it, without rust-src):
#   cargo +nightly check-web --workspace
check-web = [
    "check",
    "--target", "wasm32-unknown-unknown",
    "-Zbuild-std=std,panic_unwind",
    "--config", "target.wasm32-unknown-unknown.rustflags = ['-Cpanic=unwind', '-Cllvm-args=-wasm-use-legacy-eh=false']",
]

# Windows gives a program's main thread 1 MiB of stack, Linux 8 MiB: the tests (and the examples) on the main thread
# as on Linux. (Apps get the same from kompoz_platform::build::windows_resources.)
[target.x86_64-pc-windows-msvc]
rustflags = ["-Clink-arg=/STACK:8388608"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-Clink-arg=/STACK:8388608"]
[target.x86_64-pc-windows-gnu]
rustflags = ["-Clink-arg=-Wl,--stack,8388608"]
