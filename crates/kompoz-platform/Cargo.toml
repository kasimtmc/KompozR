[package]
name = "kompoz-platform"
description = "KompozR's platforms: the app core (frames, events, the kept frame drawn by the GPU renderer, scripts), the app entry, the headless platform, and on Linux the event loop, keyboards, desktop services and the Wayland and X11 platforms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kompoz-gpu = { path = "../kompoz-gpu" }
kompoz-graphics = { path = "../kompoz-graphics" }
kompoz-runtime = { path = "../kompoz-runtime" }
kompoz-ui = { path = "../kompoz-ui" }
libc = "0.2"

[dev-dependencies]
kompoz-foundation = { path = "../kompoz-foundation" }
kompoz-text = { path = "../kompoz-text" }

# The app core on the headless platform (a GPU device: lavapipe in CI), one thread, in sequence.
[[test]]
name = "app_core"
harness = false

# xkbcommon's keymaps, compose and the keysym table.
[[test]]
name = "xkb"
harness = false

# The event loop: wakes from other threads, timers, signals.
[[test]]
name = "event_loop"
harness = false

# Our D-Bus client, the settings portal, the desktop services and the AT-SPI bridge, on a dbus-daemon of their own
# (skipped without one unless KOMPOZ_DBUS_REQUIRED=1).
[[test]]
name = "dbus"
harness = false

# The wallpaper's colors: KDE's config read, changes followed by inotify.
[[test]]
name = "wallpaper"
harness = false

# The Wayland platform on a compositor of its own (kwin_wayland --virtual), running the Counter: KOMPOZ_DISPLAY_TESTS=1.
[[test]]
name = "wayland_display"
harness = false
