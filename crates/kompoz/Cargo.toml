[package]
name = "kompoz"
description = "KompozR: Jetpack Compose's UI toolkit in Rust, its crates under one name, a prelude, and Kotlin's syntax (kompoz! { … }, kompoz_file!)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `kompoz::test`: the headless test rule (androidx.compose.ui.test), for a crate's tests:
# `[dev-dependencies] kompoz = { …, features = ["test"] }`.
test = ["dep:kompoz-test"]

[dependencies]
kompoz-animation = { path = "../kompoz-animation" }
kompoz-animation-graphics = { path = "../kompoz-animation-graphics" }
kompoz-coroutines = { path = "../kompoz-coroutines" }
kompoz-foundation = { path = "../kompoz-foundation" }
kompoz-gpu = { path = "../kompoz-gpu" }
kompoz-graphics = { path = "../kompoz-graphics" }
kompoz-kotlin-macro = { path = "../kompoz-kotlin-macro" }
# (stage 13: lifecycles; navigation)
kompoz-lifecycle = { path = "../kompoz-lifecycle" }
kompoz-material-icons-core = { path = "../kompoz-material-icons-core" }
# (WP4b: icons)
kompoz-material-icons-extended = { path = "../kompoz-material-icons-extended" }
kompoz-material-ripple = { path = "../kompoz-material-ripple" }
kompoz-material3 = { path = "../kompoz-material3" }
# (WP8: adaptive)
kompoz-material3-adaptive = { path = "../kompoz-material3-adaptive" }
kompoz-material3-adaptive-navigation-suite = { path = "../kompoz-material3-adaptive-navigation-suite" }
kompoz-navigation = { path = "../kompoz-navigation" }
# (stage 13 WP4: Navigation 3)
kompoz-navigation3 = { path = "../kompoz-navigation3" }
kompoz-navigationevent = { path = "../kompoz-navigationevent" }
kompoz-platform = { path = "../kompoz-platform" }
# (stage 13 WP-R: resources; Coil's AsyncImage)
kompoz-coil = { path = "../kompoz-coil" }
kompoz-resources = { path = "../kompoz-resources" }
kompoz-runtime = { path = "../kompoz-runtime" }
kompoz-test = { path = "../kompoz-test", optional = true }
kompoz-text = { path = "../kompoz-text" }
kompoz-ui = { path = "../kompoz-ui" }

[dev-dependencies]
# (its own tests use `kompoz::test`)
kompoz = { path = ".", features = ["test"] }
trybuild = "1"

# Kotlin's syntax end to end: kompoz! { … } compiled and composed, one thread, in sequence.
[[test]]
name = "kotlin"
harness = false

# What the compiler says when the Kotlin is wrong (trybuild: tests/compile-fail/*.rs and their .stderr).
[[test]]
name = "compile_fail"

# The C++ Kompoz's Kotlin-syntax tests ported (kompozable_tests.cpp's stage-9 ones).
[[test]]
name = "kotlin_ported"
harness = false

# Foundation's components in Kotlin's syntax.
[[test]]
name = "kotlin_foundation"
harness = false

# SubcomposeLayout and BoxWithConstraints in Kotlin's syntax.
[[test]]
name = "kotlin_subcompose"
harness = false

# animation-core's value layer in Kotlin's syntax.
[[test]]
name = "kotlin_animation"
harness = false

# Scrolling, dragging and overscroll in Kotlin's syntax.
[[test]]
name = "kotlin_scroll"
harness = false

# Draggables, anchored and 2D drags, transformable and drag and drop in Kotlin's syntax.
[[test]]
name = "kotlin_gestures"
harness = false

[[test]]
name = "kotlin_lazy"
harness = false

# Lazy grids, staggered grids and pagers in Kotlin's syntax.
[[test]]
name = "kotlin_grids_pager"
harness = false

[[test]]
name = "kotlin_text_input"
harness = false

# The state-based text fields (BasicTextField, BasicSecureTextField) in Kotlin's syntax.
[[test]]
name = "kotlin_text_field"
harness = false

# The value-based text fields (BasicTextField(value, onValueChange)) in Kotlin's syntax.
[[test]]
name = "kotlin_text_field_value"
harness = false

# Non-lazy layouts, the marquee, the tooltip box and the ripple in Kotlin's syntax.
[[test]]
name = "kotlin_layouts"
harness = false

[[test]]
name = "kotlin_desktop"
harness = false

[[test]]
name = "kotlin_content"
harness = false

# Lookahead (LookaheadScope, approach layouts, lookahead coordinates) in Kotlin's syntax.
[[test]]
name = "kotlin_lookahead"
harness = false

# Transitions, infinite transitions and animate*AsState in Kotlin's syntax.
[[test]]
name = "kotlin_transitions"
harness = false

# Animated vectors (animation-graphics) in Kotlin's syntax.
[[test]]
name = "kotlin_animated_vector"
harness = false

# Composition locals computed where they are read (providesComputed, compositionLocalWithComputedDefaultOf) in
# Kotlin's syntax.
[[test]]
name = "kotlin_locals"
harness = false

# Kotlin's inline functions (scope functions, repeat, a list's forEach/map…) whose lambdas suspend with their
# coroutine, in Kotlin's syntax.
[[test]]
name = "kotlin_inline_suspend"
harness = false

# Compose's own inline functions (buildAnnotatedString, withStyle, withLink, PathData, ImageVector.Builder's group and
# path, takeOrElse, TextFieldState.edit, MutatorMutex.tryMutate, Canvas.withSave) whose lambdas suspend with their
# coroutine, in Kotlin's syntax.
[[test]]
name = "kotlin_compose_inline"
harness = false

# Lookahead animations of bounds (animateContentSize, animateBounds, BoundsTransform, the visual debugging) in
# Kotlin's syntax.
[[test]]
name = "kotlin_bounds"
harness = false

[[test]]
name = "named_forms"
harness = false

# The C++ Kompoz's Material Kotlin sources (kompozable_tests.cpp) whole: KotlinHelpers, MaterialForms, SectionsForms,
# TextStyles, ScrollForms, GraphicsForms' and AppShellForms' Material lines.
[[test]]
name = "kotlin_material_sources"
harness = false

# Enter and exit transitions, AnimatedVisibility, AnimatedContent and Crossfade in Kotlin's syntax.
[[test]]
name = "kotlin_animated"
harness = false

# Shared elements in Kotlin's syntax (SharedTransitionLayout, sharedElement/sharedBounds, the overlay)
[[test]]
name = "kotlin_shared"
harness = false

# Foundation's styles in Kotlin's syntax (Style { … }, styleable, style states and animations)
[[test]]
name = "kotlin_style"
harness = false

# Material's theme in Kotlin's syntax (theming_as_compose_writes_it; material3's theme, color, type and Surface
# samples from a .kt file).
[[test]]
name = "kotlin_material_theme"
harness = false

# Material's buttons and containers in Kotlin's syntax (required_arguments_by_name, containers_as_compose_writes_them;
# material3's button, icon button, FAB, card and chip samples from a .kt file).
[[test]]
name = "kotlin_buttons"
harness = false

# Material's lists, tabs, dialogs, sheets, swipe to dismiss and pull to refresh in Kotlin's syntax (the C++ Kompoz's
# Settings, KotlinHelpers, AddTextDialog/DialogHost, Navigation's tabs and ScrollForms' pull to refresh; material3's
# samples of those components from .kt files).
[[test]]
name = "kotlin_lists_sheets"
harness = false

# Material's navigation bars, rails and drawers in Kotlin's syntax (the C++ Kompoz's navigation tests written as a
# Compose user would; material3's NavigationBar, NavigationRail, Drawer and badge samples from .kt files).
[[test]]
name = "kotlin_navigation"
harness = false

# Material's selection controls in Kotlin's syntax (NamedHeads' checkbox; material3's Checkbox, TriStateCheckbox,
# RadioButton and Switch samples and XDefaults.colors(…) from a .kt file; the sliders: the C++ Expressive source's
# and material3's SliderSamples).
[[test]]
name = "kotlin_controls"
harness = false

# Material's progress indicators in Kotlin's syntax (the progress lines of the C++ MaterialForms and GraphicsForms;
# material3's ProgressIndicatorSamples from a .kt file; the deprecated forms and the defaults by name).
[[test]]
name = "kotlin_progress"
harness = false

# (WP6: pickers) Material's date and time pickers in Kotlin's syntax: the C++ Kompoz's picker tests written as a
# Compose user would, material3's DatePickerSamples and TimePickerSamples from .kt files.
[[test]]
name = "kotlin_pickers"
harness = false

# (WP7) Material's search bars, rich tooltips and carousels in Kotlin's syntax (the C++ ScrollForms' SearchBar part,
# SectionsForms' tooltip parts; material3's SearchBar, Tooltip and Carousel samples from .kt files, CarouselItemScope
# and TooltipScope receivers).
[[test]]
name = "kotlin_search_carousel"
harness = false

# Material's Expressive buttons in Kotlin's syntax (the C++ Kompoz's Expressive, Mixed's segments and Navigation's FAB
# menu; its toggle/split/group/FAB-menu/segmented tests written as a Compose user would; material3's samples of them).
[[test]]
name = "kotlin_expressive_buttons"
harness = false

# The C++ Kompoz's whole Animations (kompozable_tests.cpp animation_as_compose_writes_it) from a .kt file
[[test]]
name = "kotlin_animations_all"
harness = false

# Material's text fields in Kotlin's syntax (kompozable_tests.cpp's TextForms, Phone, AddTextDialog; material3's
# TextFieldSamples from a .kt file).
[[test]]
name = "kotlin_material_fields"
harness = false

# Material's menus in Kotlin's syntax (material3's MenuSamples and ExposedDropdownMenuSamples from a .kt file).
[[test]]
name = "kotlin_menus"
harness = false

# Material's Scaffold in Kotlin's syntax (the C++ Kompoz's ScaffoldExample, ScrollForms' app bars, Navigation's floating
# toolbar; material3's ScaffoldSamples and the samples written over a Scaffold from .kt files).
[[test]]
name = "kotlin_scaffold"
harness = false

# Material's app bars in Kotlin's syntax (material3's AppBarSamples from .kt files: top and bottom app bars, AppBarRow and
# AppBarColumn).
[[test]]
name = "kotlin_app_bars"
harness = false

# Material's floating toolbars in Kotlin's syntax (material3's FloatingToolbarSamples from a .kt file).
[[test]]
name = "kotlin_floating_toolbar"
harness = false

# (WP8: adaptive) Material's adaptive layouts (pane scaffolds, size classes) and navigation suite in Kotlin's syntax
# (the C++ Kompoz's LayoutForms pane scaffolds, MaterialForms' NavigationSuiteScaffold and its adaptive tests written
# as a Compose user would; the adaptive-layout and navigation-suite samples from .kt files).
[[test]]
name = "kotlin_adaptive"
harness = false

# (stage 13 WP0) Lifecycles in Kotlin's syntax (the C++ Kompoz's KitchenForms; lifecycle-runtime-compose's samples
# from a .kt file; the rest of the API as an app writes it).
[[test]]
name = "kotlin_lifecycle"
harness = false

# (stage 13 WP1) ViewModels and saved state in Kotlin's syntax (the C++ Kompoz's TodoScreen and QueryViewModel;
# lifecycle-viewmodel-compose's and savedstate's samples from a .kt file).
[[test]]
name = "kotlin_viewmodel"
harness = false

# (stage 13 WP-E) Back handling in Kotlin's syntax: activity-compose's and navigationevent-compose's samples from a
# .kt file (BackHandler, PredictiveBackHandler, rememberNavigationEventDispatcherOwner) and navigationevent's
# composables as an app writes them (NavigationBackHandler, NavigationEventHandler, rememberNavigationEventState).
[[test]]
name = "kotlin_navigation_event"
harness = false

# (stage 13 WP2) Navigation's core in Kotlin's syntax (typed routes, navOptions, deep links, arguments).
[[test]]
name = "kotlin_navigation_core"
harness = false

# Compose Multiplatform's resources (Res.*, Android's R.*) in Kotlin's syntax: tests/composeResources.
[[test]]
name = "kotlin_resources"
harness = false

# (stage 13 WP3) The NavHost in Kotlin's syntax: the C++ Navigator and AppShellForms, navigation-compose's samples.
[[test]]
name = "kotlin_nav_host"
harness = false

# (stage 13 WP4) Navigation 3 in Kotlin's syntax: navigation3-ui's and navigation3-runtime's samples from a .kt file
# (NavDisplay, entryProvider, rememberNavBackStack, scenes and strategies, decorators).
[[test]]
name = "kotlin_navigation3"
harness = false
