[package]
name = "kompoz"
description = "KompozR: Jetpack Compose's UI toolkit in Rust, its crates under one name, a prelude, and Kotlin's syntax (kompoz! { … }, kompoz_file!)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `kompoz::test`: the headless test rule (androidx.compose.ui.test), for a crate's tests:
# `[dev-dependencies] kompoz = { …, features = ["test"] }`.
test = ["dep:kompoz-test"]

[dependencies]
kompoz-animation = { path = "../kompoz-animation" }
kompoz-animation-graphics = { path = "../kompoz-animation-graphics" }
kompoz-coroutines = { path = "../kompoz-coroutines" }
kompoz-foundation = { path = "../kompoz-foundation" }
kompoz-gpu = { path = "../kompoz-gpu" }
kompoz-graphics = { path = "../kompoz-graphics" }
kompoz-kotlin-macro = { path = "../kompoz-kotlin-macro" }
kompoz-material-ripple = { path = "../kompoz-material-ripple" }
kompoz-platform = { path = "../kompoz-platform" }
kompoz-runtime = { path = "../kompoz-runtime" }
kompoz-test = { path = "../kompoz-test", optional = true }
kompoz-text = { path = "../kompoz-text" }
kompoz-ui = { path = "../kompoz-ui" }

[dev-dependencies]
# (its own tests use `kompoz::test`)
kompoz = { path = ".", features = ["test"] }
trybuild = "1"

# Kotlin's syntax end to end: kompoz! { … } compiled and composed, one thread, in sequence.
[[test]]
name = "kotlin"
harness = false

# What the compiler says when the Kotlin is wrong (trybuild: tests/compile-fail/*.rs and their .stderr).
[[test]]
name = "compile_fail"

# The C++ Kompoz's Kotlin-syntax tests ported (kompozable_tests.cpp's stage-9 ones).
[[test]]
name = "kotlin_ported"
harness = false

# Foundation's components in Kotlin's syntax.
[[test]]
name = "kotlin_foundation"
harness = false

# SubcomposeLayout and BoxWithConstraints in Kotlin's syntax.
[[test]]
name = "kotlin_subcompose"
harness = false

# animation-core's value layer in Kotlin's syntax.
[[test]]
name = "kotlin_animation"
harness = false

# Scrolling, dragging and overscroll in Kotlin's syntax.
[[test]]
name = "kotlin_scroll"
harness = false

# Draggables, anchored and 2D drags, transformable and drag and drop in Kotlin's syntax.
[[test]]
name = "kotlin_gestures"
harness = false

[[test]]
name = "kotlin_lazy"
harness = false

# Lazy grids, staggered grids and pagers in Kotlin's syntax.
[[test]]
name = "kotlin_grids_pager"
harness = false

[[test]]
name = "kotlin_text_input"
harness = false

# The state-based text fields (BasicTextField, BasicSecureTextField) in Kotlin's syntax.
[[test]]
name = "kotlin_text_field"
harness = false

# The value-based text fields (BasicTextField(value, onValueChange)) in Kotlin's syntax.
[[test]]
name = "kotlin_text_field_value"
harness = false

# Non-lazy layouts, the marquee, the tooltip box and the ripple in Kotlin's syntax.
[[test]]
name = "kotlin_layouts"
harness = false

[[test]]
name = "kotlin_desktop"
harness = false

[[test]]
name = "kotlin_content"
harness = false

# Lookahead (LookaheadScope, approach layouts, lookahead coordinates) in Kotlin's syntax.
[[test]]
name = "kotlin_lookahead"
harness = false

# Transitions, infinite transitions and animate*AsState in Kotlin's syntax.
[[test]]
name = "kotlin_transitions"
harness = false

# Animated vectors (animation-graphics) in Kotlin's syntax.
[[test]]
name = "kotlin_animated_vector"
harness = false

# Composition locals computed where they are read (providesComputed, compositionLocalWithComputedDefaultOf) in
# Kotlin's syntax.
[[test]]
name = "kotlin_locals"
harness = false

# Lookahead animations of bounds (animateContentSize, animateBounds, BoundsTransform, the visual debugging) in
# Kotlin's syntax.
[[test]]
name = "kotlin_bounds"
harness = false

[[test]]
name = "named_forms"
harness = false

# Enter and exit transitions, AnimatedVisibility, AnimatedContent and Crossfade in Kotlin's syntax.
[[test]]
name = "kotlin_animated"
harness = false
