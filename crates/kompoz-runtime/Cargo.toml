[package]
name = "kompoz-runtime"
description = "KompozR's composition runtime: snapshots, the group tree, scopes and smart recomposition, remember, effects, composition locals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dev-dependencies]
trybuild = "1"

# (stage 15) The system's word without a platform's: Windows' user locale and time zone (its zone's name mapped to an
# IANA ID by CLDR's table, ICU4X's); Android's system properties (its time zone).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Time"] }
icu_time = "2.4.0"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dependencies]
kompoz-macros = { path = "../kompoz-macros" }
parking_lot.workspace = true
# (stage 14 WPD) The kt shims' java.text.SimpleDateFormat and java.util.Calendar/Locale: CLDR's names, digits and
# week data, as the JDK's locale data.
icu_calendar = "2.4.0"
icu_datetime = "2.4.0"
icu_decimal = "2.4.0"
icu_locale_core = "2.4.0"
writeable = "0.6.4"

[[test]]
name = "runtime"
harness = false

[[test]]
name = "macros"
harness = false

[[test]]
name = "subcomposition"
harness = false

[[test]]
name = "state_observer"
harness = false
