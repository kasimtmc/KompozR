[package]
name = "kompoz-lifecycle"
description = "KompozR's lifecycles, saved state and ViewModels (androidx.lifecycle 2.11: lifecycle-common, lifecycle-runtime, lifecycle-runtime-compose, lifecycle-viewmodel, lifecycle-viewmodel-savedstate, lifecycle-viewmodel-compose; androidx.savedstate 1.4): Lifecycle and its states and events, observers, LifecycleRegistry, repeatOnLifecycle, LocalLifecycleOwner and the lifecycle effects; SavedState, SavedStateRegistry and its owner; ViewModel, ViewModelStore, ViewModelProvider, SavedStateHandle, viewModel()"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kompoz-coroutines = { path = "../kompoz-coroutines" }
kompoz-runtime = { path = "../kompoz-runtime" }

[dev-dependencies]
# (the effects composed in a test rule's host: the app's lifecycle owner)
kompoz-test = { path = "../kompoz-test" }
# (the host half of saved_state_outlives_the_host: a text field state)
kompoz-foundation = { path = "../kompoz-foundation" }

[[test]]
name = "lifecycle"
harness = false

[[test]]
name = "viewmodel"
harness = false
