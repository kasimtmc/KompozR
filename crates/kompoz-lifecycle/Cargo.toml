[package]
name = "kompoz-lifecycle"
description = "KompozR's lifecycles (androidx.lifecycle 2.11: lifecycle-common, lifecycle-runtime, lifecycle-runtime-compose): Lifecycle and its states and events, observers, LifecycleRegistry, repeatOnLifecycle, LocalLifecycleOwner and the lifecycle effects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kompoz-coroutines = { path = "../kompoz-coroutines" }
kompoz-runtime = { path = "../kompoz-runtime" }

[dev-dependencies]
# (the effects composed in a test rule's host: the app's lifecycle owner)
kompoz-test = { path = "../kompoz-test" }

[[test]]
name = "lifecycle"
harness = false
