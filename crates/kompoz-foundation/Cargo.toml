[package]
name = "kompoz-foundation"
description = "KompozR's foundation (androidx.compose.foundation and foundation.layout): Box, Row, Column, Spacer, arrangements, padding and size modifiers, clickables, focusables, interactions and indications, BasicText with its links, inline content and auto size"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
