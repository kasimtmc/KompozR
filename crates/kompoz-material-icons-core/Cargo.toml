[package]
name = "kompoz-material-icons-core"
description = "KompozR's core Material icons (androidx.compose.material:material-icons-core 1.7.8): Icons.Filled, Outlined, Rounded, Sharp, TwoTone and AutoMirrored, each built once when first asked for"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["filled", "outlined", "rounded", "sharp", "two-tone", "auto-mirrored"]
# A theme's icons (Icons.Filled…); `auto-mirrored` the AutoMirrored ones of the themes chosen.
filled = []
outlined = []
rounded = []
sharp = []
two-tone = []
auto-mirrored = []

[dependencies]
kompoz-graphics = { path = "../kompoz-graphics" }
kompoz-runtime = { path = "../kompoz-runtime" }

