[package]
name = "kompoz-animation-graphics"
description = "KompozR's animated vector graphics (androidx.compose.animation.graphics): AnimatedImageVector, its animators (object animators, sets, property values holders, keyframes) played by a Transition in rememberAnimatedVectorPainter, and Android's animated-vector, animator and interpolator XML read"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kompoz-animation = { path = "../kompoz-animation" }
kompoz-graphics = { path = "../kompoz-graphics" }
# (stage 13 WP-R: animatedVectorResource on the resources)
kompoz-resources = { path = "../kompoz-resources" }
kompoz-runtime = { path = "../kompoz-runtime" }
kompoz-ui = { path = "../kompoz-ui" }

[dev-dependencies]
kompoz-foundation = { path = "../kompoz-foundation" }
kompoz-test = { path = "../kompoz-test" }

# Animated vectors read from XML and played (the data: AnimatedImageVector::vector_at), Android's interpolators.
[[test]]
name = "animated_vector"
harness = false

# rememberAnimatedVectorPainter: the painter played forward and back by its Transition.
[[test]]
name = "painter"
harness = false

# animatedVectorResource: an animated vector drawable of tests/composeResources through its Res, its drawable by
# reference.
[[test]]
name = "animated_vector_resource"
harness = false
