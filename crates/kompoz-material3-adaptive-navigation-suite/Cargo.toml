[package]
name = "kompoz-material3-adaptive-navigation-suite"
description = "KompozR's Material 3 navigation suite (androidx.compose.material3:material3-adaptive-navigation-suite 1.5.0-alpha17): a scaffold whose navigation is a bar, a rail or a drawer to suit the window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kompoz-animation = { path = "../kompoz-animation" }
kompoz-coroutines = { path = "../kompoz-coroutines" }
kompoz-foundation = { path = "../kompoz-foundation" }
kompoz-graphics = { path = "../kompoz-graphics" }
kompoz-material3 = { path = "../kompoz-material3" }
kompoz-material3-adaptive = { path = "../kompoz-material3-adaptive" }
kompoz-runtime = { path = "../kompoz-runtime" }
kompoz-text = { path = "../kompoz-text" }
kompoz-ui = { path = "../kompoz-ui" }

[dev-dependencies]
kompoz-material-icons-core = { path = "../kompoz-material-icons-core" }
kompoz-material-icons-extended = { path = "../kompoz-material-icons-extended" }
kompoz-test = { path = "../kompoz-test" }

# The navigation suite: the C++ Kompoz's tests by name, Compose's behaviour, NavigationSuiteScaffoldSamples.
[[test]]
name = "navigation_suite"
harness = false
