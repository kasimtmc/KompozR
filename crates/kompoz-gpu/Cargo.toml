[package]
name = "kompoz-gpu"
description = "KompozR's GPU renderer: the device layer (Vulkan, Metal, WebGPU) and the renderer core that draws a frame's display list"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kompoz-graphics = { path = "../kompoz-graphics" }
kompoz-runtime = { path = "../kompoz-runtime" }
kompoz-text = { path = "../kompoz-text" }
kompoz-ui = { path = "../kompoz-ui" }
skrifa = "0.50.0"

# (stage 15) Vulkan where it is the target's API: not on Apple's systems (Metal is), nor on the web (no Vulkan loader:
# ash's `loaded` loader is libloading's, which has no library to load there).
[target.'cfg(not(any(target_family = "wasm", target_vendor = "apple")))'.dependencies]
ash = "0.38.0"

# (stage 15) Metal on Apple's systems, through objc2's thin bindings of its Objective-C API (the device, the
# CAMetalLayer it presents to, and blocks for command buffers' completion handlers).
[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"

# (stage 15) The web's: WebGPU through our own JavaScript glue (kompoz-web).
[target.'cfg(target_family = "wasm")'.dependencies]
kompoz-web = { path = "../kompoz-web" }

# The GPU tests: one binary on one device, the tests in sequence (harness = false), as the C++ Kompoz's gpu_tests.
[[test]]
name = "gpu"
path = "tests/gpu/main.rs"
harness = false
