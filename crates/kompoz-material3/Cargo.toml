[package]
name = "kompoz-material3"
description = "KompozR's Material 3 (androidx.compose.material3 1.5): the theme — color schemes (dynamic and from the wallpaper too), typography, shapes, motion —, Text, Surface, Icon, the ripple, dividers, scrims, the design tokens and texts in some 80 languages, and the components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kompoz-animation = { path = "../kompoz-animation" }
kompoz-coroutines = { path = "../kompoz-coroutines" }
kompoz-foundation = { path = "../kompoz-foundation" }
kompoz-graphics = { path = "../kompoz-graphics" }
kompoz-material-ripple = { path = "../kompoz-material-ripple" }
kompoz-runtime = { path = "../kompoz-runtime" }
kompoz-text = { path = "../kompoz-text" }
kompoz-ui = { path = "../kompoz-ui" }
# (WP6: pickers) Dates and times by the locale (D4): CLDR's patterns, names, first day of the week, digits; "today"
# from the C library's localtime_r.
icu_calendar = "2.4.0"
icu_datetime = "2.4.0"
icu_decimal = "2.4.0"
icu_locale_core = "2.4.0"
libc = "0.2"
writeable = "0.6.4"

[dev-dependencies]
kompoz-material-icons-core = { path = "../kompoz-material-icons-core" }
# (WP4b: icons)
kompoz-material-icons-extended = { path = "../kompoz-material-icons-extended" }
kompoz-test = { path = "../kompoz-test" }

# The theme: color schemes (baseline, dynamic, wallpaper), MaterialTheme, typography, shapes, motion, the content
# color, the scrollbar style (the C++ Kompoz's area T, Compose's behaviour).
[[test]]
name = "theme"
harness = false

# Text, ProvideTextStyle, Surface, Icon, Divider, Scrim, Label, the ripple, the minimum interactive size, the
# internals the components share.
[[test]]
name = "components"
harness = false

# Label and the tooltips' base: the label following its component's interactions, the tooltip position providers,
# the tooltip scope.
[[test]]
name = "label"
harness = false

# Buttons and floating action buttons (the C++ Kompoz's area A, Compose's behaviour, M15's samples).
[[test]]
name = "buttons"
harness = false

# Icon buttons and icon toggle buttons (area A, Compose's behaviour, M15's samples).
[[test]]
name = "icon_buttons"
harness = false

# Cards, chips, badges (area A's containers, Compose's behaviour, M15's samples).
[[test]]
name = "containers"
harness = false

# Buttons and containers together, and the Material halves of earlier tests about buttons and clickables.
[[test]]
name = "buttons_and_containers"
harness = false

# List items (area S: the classic and Expressive interactive and segmented items, Compose's behaviour, M15's samples).
[[test]]
name = "lists"
harness = false

# Bottom sheets (the C++ Kompoz's sheet tests by name, M15's values; Compose's behaviour; M15's BottomSheetSamples
# and DragHandleSamples): BottomSheet, ModalBottomSheet, BottomSheetScaffold, SheetState, VerticalDragHandle.
[[test]]
name = "sheets"
harness = false

# Snackbars and plain tooltips (the C++ Kompoz's snackbar and tooltip tests by name, M15's values; Compose's behaviour;
# M15's SnackbarSamples and TooltipSamples' plain tooltips): Snackbar, SnackbarHost(State), TooltipBox, PlainTooltip.
[[test]]
name = "snackbars_tooltips"
harness = false

# (WP7: search) Search bars (the C++ Kompoz's search tests by name, M15's values; Compose's behaviour; M15's
# SearchBarSamples): SearchBar, DockedSearchBar, the expanded search bars, TopSearchBar, AppBarWithSearch.
[[test]]
name = "search_bar"
harness = false

# (WP7: carousel) Carousels (the C++ Kompoz's carousel tests by name, M15's values; Compose's keyline math and
# behaviour; M15's CarouselSamples).
[[test]]
name = "carousel"
harness = false

# (WP5: tabs) Tabs and tab rows (the C++ Kompoz's tab tests by name, Compose's behaviour, M15's TabSamples).
[[test]]
name = "tabs"
harness = false

# (WP5: dialogs) Alert dialogs and basic alert dialogs (the C++ Kompoz's dialog tests by name, Compose's behaviour,
# M15's AlertDialogSamples).
[[test]]
name = "dialogs"
harness = false

# (WP5: swipe to dismiss and pull to refresh) The C++ Kompoz's swipe-to-dismiss and pull-to-refresh tests by name
# (M15's values), Compose's behaviour, M15's SwipeToDismissSamples and PullToRefreshSamples.
[[test]]
name = "swipe_pull"
harness = false

# The text fields: filled, outlined and secure, on both engines — their decoration (label, placeholder, icons,
# prefix and suffix, supporting text), colors, shapes, the indicator line, the outline's cut, the layouts.
[[test]]
name = "text_field"
harness = false

# The menus: the dropdown menu and its items (standard, and the Expressive checkable, selectable and shaped ones),
# the Expressive menu's popup and groups, their colors and shapes, the exposed dropdown menu and its anchors.
[[test]]
name = "menus"
harness = false

# The Material halves of the C++ Kompoz's text field tests whose editing halves are foundation's (by name): the
# decoration's geometry (16 dp in, 56 dp tall, 280 dp wide), line limits, baselines, the theme's selection colors,
# taps, selections, handles and the magnifier placed from the Material field's inset.
[[test]]
name = "text_field_halves"
harness = false

# (WP4b: rail) Navigation rails and wide navigation rails (the C++ Kompoz's rail tests by name, M15's values,
# Compose's behaviour, M15's NavigationRailSamples).
[[test]]
name = "navigation_rail"
harness = false

# (WP4b: bar) Navigation bars and short navigation bars (the C++ Kompoz's bar tests by name, M15's values,
# Compose's behaviour, M15's NavigationBarSamples and BadgeSamples' NavigationBarItemWithBadge).
[[test]]
name = "navigation_bar"
harness = false

# (WP4b: drawer) Navigation drawers (the C++ Kompoz's drawer tests by name, M15's values, Compose's behaviour, M15's
# DrawerSamples): ModalNavigationDrawer, DismissibleNavigationDrawer, PermanentNavigationDrawer, the sheets, DrawerState,
# NavigationDrawerItem.
[[test]]
name = "navigation_drawer"
harness = false

# The selection controls: Checkbox, TriStateCheckbox, RadioButton, Switch — drawing and animating as Compose's
# (1.4's values, 1.5's checkbox styling fix), their colors, ripple, room to touch and semantics.
[[test]]
name = "controls"
harness = false

# The sliders: Slider (plain, slots, state), RangeSlider, VerticalSlider, their states and SliderDefaults' thumbs
# and tracks — taps, drags, steps, keys, RTL, interactions, semantics, drawing (the C++ Kompoz's slider tests by
# name, M15's behaviour).
[[test]]
name = "slider"
harness = false

# The progress indicators: LinearProgressIndicator, CircularProgressIndicator (determinate, endless, the deprecated
# value forms), the wavy ones (Expressive), their defaults: drawing, gaps, stop indicators, RTL, animations,
# semantics (the C++ Kompoz progress tests by name, M15 behaviour).
[[test]]
name = "progress"
harness = false

# The loading indicators (Expressive): LoadingIndicator and ContainedLoadingIndicator, determinate and endless, their
# defaults: morphs, turns, sizes, colors, semantics (the C++ Kompoz loading indicator tests by name, M15 behaviour).
[[test]]
name = "loading_indicator"
harness = false

# (WP6: date pickers) Date pickers, date range pickers, their input modes and the dialog (the C++ Kompoz's date picker
# tests by name, Compose's behaviour, M15's DatePickerSamples), the calendar model and the locale's date formats.
[[test]]
name = "date_picker"
harness = false

# (WP6: time pickers) Time pickers, time inputs and the dialog (the C++ Kompoz's time picker tests by name, Compose's
# behaviour, M15's TimePickerSamples).
[[test]]
name = "time_picker"
harness = false

# (WP4a: scaffold) The scaffold (the C++ Kompoz's scaffold tests by name, M15's values; Compose's behaviour: the slots'
# places, the FAB's positions, the snackbar, the content's padding and insets; M15's ScaffoldSamples and animated FAB samples).
[[test]]
name = "scaffold"
harness = false

# (WP4a: top app bars) The top app bars (the C++ Kompoz's top app bar tests by name, M15's values; Compose's behaviour:
# the state, the scroll behaviors, the drags, the colors, the overrides, the defaults; M15's AppBarSamples' top bars).
[[test]]
name = "top_app_bars"
harness = false

# (WP4a: bottom app bars) The bottom app bars, AppBarRow and AppBarColumn (the C++ Kompoz's tests by name, M15's
# values; Compose's behaviour: the state and its saver, the exit-always behavior, the drags, the defaults, the items and
# the overflow menu; M15's AppBarSamples' bottom bars).
[[test]]
name = "bottom_app_bars"
harness = false

# (WP4a: toolbar) The floating toolbars (the C++ Kompoz's toolbar test by name, M15's values; Compose's behaviour: the
# screen reader's actions, the FABs, the balanced padding, the nested scroll, the exit-always behavior, the overrides,
# the defaults; M15's FloatingToolbarSamples).
[[test]]
name = "floating_toolbar"
harness = false

# (WP1b: toggle_split) Toggle buttons (the C++ Kompoz's toggle button test by name, M15's values, Compose's
# behaviour, M15's ToggleButtonSamples): ToggleButton, Elevated/Tonal/OutlinedToggleButton, ToggleButtonDefaults.
[[test]]
name = "toggle_buttons"
harness = false

# (WP1b: toggle_split) Split buttons (the C++ Kompoz's split button test by name, M15's values, Compose's behaviour,
# M15's SplitButtonSamples): SplitButtonLayout, SplitButtonDefaults' buttons, sizes and shapes.
[[test]]
name = "split_buttons"
harness = false

# (WP1b: group) Button groups (C++ button_group_* tests, connected groups, expressive named arguments, the group's
# whole-pixel part; Compose's behaviour; M15's ButtonGroupSamples): ButtonGroup, ButtonGroupScope, ButtonGroupDefaults.
[[test]]
name = "button_groups"
harness = false

# (WP1b: fab_segmented) Segmented buttons (the C++ Kompoz's segmented button tests by name, M15's values, Compose's
# behaviour, M15's SegmentedButtonSamples): Single/MultiChoiceSegmentedButtonRow, SegmentedButton, the defaults.
[[test]]
name = "segmented_buttons"
harness = false

# (WP1b: fab_segmented) The FAB menu (the C++ Kompoz's FAB menu test and its named form by name, M15's values,
# Compose's behaviour, M15's FloatingActionButtonMenuSample): FloatingActionButtonMenu, ToggleFloatingActionButton.
[[test]]
name = "fab_menu"
harness = false
