[package]
name = "kompoz-text"
description = "KompozR's text (androidx.compose.ui.text): fonts, shaping, bidirectional text, line breaking, paragraphs, AnnotatedString, TextMeasurer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kompoz-graphics = { path = "../kompoz-graphics" }
kompoz-coroutines = { path = "../kompoz-coroutines" }
kompoz-runtime = { path = "../kompoz-runtime" }
fontique = { version = "0.13.0", features = ["fontconfig-dlopen"] }
harfrust = "0.16.0"
icu_locale_core = "2.4.0"
icu_properties = "2.4.0"
icu_segmenter = "2.4.0"
read-fonts = "0.47.0"
skrifa = "0.50.0"
unicode-bidi = "0.3.18"
