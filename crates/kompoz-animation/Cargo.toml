[package]
name = "kompoz-animation"
description = "KompozR's animation value layer (androidx.compose.animation.core and animation's decay): Animatable, AnimationState, animate, specs (spring, tween, snap, keyframes, repeatable), easings, vector converters, decays and Android's fling spline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kompoz-coroutines = { path = "../kompoz-coroutines" }
kompoz-graphics = { path = "../kompoz-graphics" }
kompoz-runtime = { path = "../kompoz-runtime" }
kompoz-ui = { path = "../kompoz-ui" }

[dev-dependencies]
kompoz-foundation = { path = "../kompoz-foundation" }
kompoz-test = { path = "../kompoz-test" }

[[test]]
name = "specs"
harness = false

[[test]]
name = "animatable"
harness = false

[[test]]
name = "lookahead"
harness = false

[[test]]
name = "clock"
harness = false
