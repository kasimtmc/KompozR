[package]
name = "xtask"
description = "KompozR's development tasks: `cargo xtask shaders [--check]` compiles the GPU renderer's shaders, `cargo xtask wayland [--check]` generates the Wayland protocols' Rust, `cargo xtask kotlin-index [--check]` writes the API index, `cargo xtask material3-tokens|material3-strings|material-icons [--check]` convert material3's tokens and texts and the material icons from their sources jars"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# (inflating the jars the material generators read)
miniz_oxide = "0.9"
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
