[workspace]
resolver = "3"
members = ["prototypes/syntax", "prototypes/syntax-macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kasimtmc/KompozR"

[workspace.dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit-mut"] }
