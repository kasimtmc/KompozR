[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kasimtmc/KompozR"

[workspace.dependencies]
parking_lot = "0.13"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit", "visit-mut", "extra-traits"] }

[workspace.lints.clippy]
# Closures and observers in Rc/Arc read plainly as they are; naming each one would hide what it is.
type_complexity = "allow"
